spring.application.name=InventoryTrackingApp


# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inventory_tracking}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:inventory}
spring.datasource.password=${DB_PASSWORD:inventory}

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway (owns the schema) ---
spring.flyway.enabled=true

# --- Server ---
server.port=8080
spring.web.error.include-message=never